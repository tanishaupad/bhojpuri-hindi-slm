language = "ne"
minimum_characters = 200
minimum_words = 30
minimum_devanagari_ratio = 0.70
maximum_latin_ratio = 0.20
maximum_digit_ratio = 0.25
remove_repeated_lines = true
clean_nepali_wikipedia = true

[split]
train = 0.98
validation = 0.01
test = 0.01
seed = "lma-nepali-phase-1-2026"

[tokenizer]
model_type = "unigram"
vocabulary_sizes = [16000, 24000, 32000]
character_coverage = 1.0
