[identity]
model_name = "model_h_hindi_no_position"
language = "hi"
language_name = "Hindi"
tokenizer = "hindi/tokenizer/hindi.model"

[model]
vocabulary_size = 24000
context_length = 256
model_dimension = 384
number_of_layers = 9
number_of_heads = 6
feed_forward_dimension = 1536
dropout = 0.1
attention_dropout = 0.1
embedding_dropout = 0.1
position_encoding = "none"
normalization = "pre_layer_norm"
activation = "gelu"
tie_embeddings = true
use_bias = true

[training]
seed = 20260823
micro_batch_size = 8
gradient_accumulation_steps = 8
maximum_steps = 20300
learning_rate = 0.0003
minimum_learning_rate = 0.00003
warmup_steps = 500
weight_decay = 0.1
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_epsilon = 1e-8
gradient_clip_norm = 1.0
validation_interval = 500
validation_batches = 100
checkpoint_interval = 500
checkpoint_keep_last = 3
log_interval = 20
precision = "auto"
