language = "hi"
minimum_characters = 200
minimum_words = 30
minimum_devanagari_ratio = 0.70
maximum_latin_ratio = 0.20
maximum_digit_ratio = 0.25
remove_repeated_lines = true
clean_pib_boilerplate = true
clean_hindi_wikipedia = true
exclude_translation_marked_sources = ["hindi_wikisource", "hindi_wikibooks"]

[split]
train = 0.98
validation = 0.01
test = 0.01
seed = "lma-phase-1-2026"

[tokenizer]
model_type = "unigram"
vocabulary_sizes = [16000, 24000, 32000]
character_coverage = 1.0
